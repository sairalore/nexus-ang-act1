
   <div class="card">
    <div class="card-body">
      <h5 class="card-title">{{titulo}}</h5>
      <p class="card-text" ><strong>Nombre:</strong> {{book.nombre}}</p>
      <p class="card-text"><strong>Autor:</strong> {{book.autor}}</p>
      <p class="card-text"><strong>Categoría:</strong> {{book.categoria}}</p>
      <p class="card-text"><strong>Anio:</strong> {{book.anio}}</p>
    </div>
  </div>
  <button type="button" class="btn btn-success" (click)="enviarBook()">Editar</button>
