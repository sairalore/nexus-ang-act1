<div class="not-found-container">
  <div class="container text-center py-5">
    <div class="error-content">
      <div class="error-number mb-4">404</div>
      <h1 class="display-4 fw-bold mb-3">Página No Encontrada</h1>
      <p class="lead text-muted mb-4">
        Lo sentimos, la página que estás buscando no existe o ha sido movida.
      </p>
      
      <div class="illustration mb-4">
        <i class="bi bi-book-half"></i>
        <p class="mt-3 text-muted">Parece que este libro no está en nuestro catálogo...</p>
      </div>

      <div class="d-flex flex-wrap gap-3 justify-content-center">
        <a routerLink="/" class="btn btn-primary btn-lg">
          <i class="bi bi-house-fill me-2"></i>
          Volver al Inicio
        </a>
        <a routerLink="/libroNexus" class="btn btn-outline-primary btn-lg">
          <i class="bi bi-book me-2"></i>
          Ver Catálogo
        </a>
        <a routerLink="/cafeteria" class="btn btn-outline-secondary btn-lg">
          <i class="bi bi-cup-hot me-2"></i>
          Ir a Cafetería
        </a>
      </div>

      <div class="suggestions mt-5">
        <h5 class="mb-3">Quizás te interese:</h5>
        <div class="row justify-content-center">
          <div class="col-md-3 col-sm-6 mb-3">
            <a routerLink="/about" class="suggestion-link">
              <i class="bi bi-info-circle"></i>
              <span>Sobre Nosotros</span>
            </a>
          </div>
          <div class="col-md-3 col-sm-6 mb-3">
            <a routerLink="/contact" class="suggestion-link">
              <i class="bi bi-envelope"></i>
              <span>Contacto</span>
            </a>
          </div>
          <div class="col-md-3 col-sm-6 mb-3">
            <a routerLink="/cafeteria/productos" class="suggestion-link">
              <i class="bi bi-cup-straw"></i>
              <span>Productos</span>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
